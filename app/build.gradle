apply plugin: 'com.android.application'

android {
    namespace 'com.teamlalli61.imdone'
    compileSdk 35

    defaultConfig {
        applicationId 'com.teamlalli61.imdone'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.2.0-home-family'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

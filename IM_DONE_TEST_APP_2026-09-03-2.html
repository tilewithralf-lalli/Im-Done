<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>I'M DONE!</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f3f8;color:#202331}.app{max-width:520px;margin:auto;min-height:100vh;background:white;padding:18px}h1{font-size:34px;margin:4px 0}.top{display:flex;justify-content:space-between;align-items:center}.gear{font-size:24px;border:0;border-radius:50%;width:44px;height:44px}.stats{display:flex;justify-content:space-between;font-weight:bold;margin:14px 0 8px}.progress{height:18px;background:#eee;border-radius:20px;overflow:hidden}.bar{height:100%;background:#61c56f}.card{border:2px solid #e5e6ed;border-radius:18px;padding:14px;margin:11px 0}.done{background:#eaf9ed;border-color:#8bd596}.job{font-size:19px;font-weight:bold}.small{color:#666;font-size:13px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}button{cursor:pointer}.doneBtn,.five,.pbtn{border:0;border-radius:11px;padding:11px 13px;font-weight:bold}.doneBtn{background:#62c970}.five{background:#ffd86b}.reward,.msg{padding:13px;border-radius:15px;margin-top:14px}.reward{background:#eee7ff}.msg{background:#fff3bd}.parent{display:none}.pbtn{width:100%;margin:5px 0;background:#ececf4}.field{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin:8px 0}.celebrate{display:none;position:fixed;inset:0;background:#fffffff2;z-index:5;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:bold;padding:30px}</style></head>
<body><div id="celebrate" class="celebrate" onclick="this.style.display='none'">🎉 YOU EARNED YOUR REWARD! 🎉<br><small>Tap to close</small></div><div class="app">
<section id="child"><div class="top"><div><h1>I'M DONE! ✅</h1><div>GOOD MORNING, DYLAN 👋</div></div><button class="gear" onclick="parentView()">⚙️</button></div><div id="msg" class="msg" style="display:none"></div><div class="stats"><span id="count"></span><span>⭐ <span id="stars"></span></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="jobs"></div><div class="reward"><b>🎁 Reward: Movie Night</b><br><span id="reward"></span></div></section>
<section id="parent" class="parent"><div class="top"><div><h1>Parent</h1><div>Dylan — Today</div></div><button class="gear" onclick="childView()">←</button></div><button class="pbtn" onclick="bonus()">⭐ Give Bonus Star</button><input id="message" class="field" placeholder="Quick message to Dylan"><button class="pbtn" onclick="sendMsg()">💬 Send Quick Message</button><button id="pause" class="pbtn" onclick="togglePause()">⏸ Holiday / Away Pause</button><div class="reward"><b>🔥 Streak:</b> 5 days<br><b>📅 Weekly:</b> 38 of 42 jobs completed<br><b>⭐ Weekly stars:</b> 54</div><h3>Undo completed jobs</h3><div id="undo"></div></section>
</div><script>
const jobs=[["🪥","Brush My Teeth",1],["🛏️","Make My Bed",1],["🍱","Lunch Box",1],["🎒","Pack My School Bag",1],["🙂","Behave In School",2],["🧹","Clean My Room",3],["🐶","Feed The Dogs",2],["🗑️","Rubbish Out",2],["🌱","Lawn Done",4]];
let s=JSON.parse(localStorage.getItem("imdone-test3")||"null")||{done:{},stars:0,paused:false,msg:""};
function save(){localStorage.setItem("imdone-test3",JSON.stringify(s))}
function complete(i){if(s.paused)return alert("Routine is paused.");if(!s.done[i]){s.done[i]=1;s.stars+=jobs[i][2];save();render();if(s.stars>=12)document.getElementById("celebrate").style.display="flex"}}
function undo(i){if(s.done[i]){delete s.done[i];s.stars=Math.max(0,s.stars-jobs[i][2]);save();render()}}
function five(i){alert("⏰ 5 more minutes for "+jobs[i][1]+"\nTest button only — no real notification yet.")}
function bonus(){s.stars++;save();render()}
function sendMsg(){let v=document.getElementById("message").value.trim();if(v){s.msg=v;save();render();childView()}}
function togglePause(){s.paused=!s.paused;save();render()}
function parentView(){document.getElementById("child").style.display="none";document.getElementById("parent").style.display="block"}
function childView(){document.getElementById("parent").style.display="none";document.getElementById("child").style.display="block"}
function render(){let a=document.getElementById("jobs"),u=document.getElementById("undo");a.innerHTML="";u.innerHTML="";jobs.forEach((j,i)=>{let d=!!s.done[i];a.innerHTML+=`<div class="card ${d?"done":""}"><div class="job">${j[0]} ${j[1]}</div><div class="small">⭐ ${j[2]} • ${d?"DONE":"TO DO"}</div><div class="actions">${d?"<b>DONE ✅</b>":`<button class="doneBtn" onclick="complete(${i})">ALL DONE ✅</button><button class="five" onclick="five(${i})">5 MORE MINUTES</button>`}</div></div>`;if(d)u.innerHTML+=`<button class="pbtn" onclick="undo(${i})">↩ Undo ${j[1]}</button>`});let n=Object.keys(s.done).length;document.getElementById("count").textContent=n+" of "+jobs.length+" DONE";document.getElementById("stars").textContent=s.stars;document.getElementById("bar").style.width=(n/jobs.length*100)+"%";document.getElementById("reward").textContent=s.stars+" / 12 stars";let m=document.getElementById("msg");m.textContent="💬 Mum/Dad: "+s.msg;m.style.display=s.msg?"block":"none";document.getElementById("pause").textContent=s.paused?"▶ Resume Normal Routine":"⏸ Holiday / Away Pause"}
render();</script></body></html>
